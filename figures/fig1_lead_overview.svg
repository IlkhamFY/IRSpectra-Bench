<text x="252.0" y="146.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1A1A">45.4% = 49.8% × 91.2%</text>
<text x="252.0" y="160.0" text-anchor="middle" font-size="7.5" fill="#6B7280">top-1 227/500 = 45.4%; recall@3 249/500 = 49.8%; among recalled 227/249 = 91.2%</text>
