<text x="252.0" y="146.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1A1A">30% ≈ 34% × 89%</text>
<text x="252.0" y="160.0" text-anchor="middle" font-size="7.5" fill="#6B7280">forward-verified top-1 58/194 = 30%; precision|recall 58/65 = 89%</text>
